services:
  brain-3d:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3d-brain:dev
    container_name: brain-3d-dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    stdin_open: true
    tty: true
    command: /bin/bash

  jupyter:
    image: 3d-brain:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-3d-jupyter
    working_dir: /app
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-brain}"
    command:
      - python
      - -m
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --NotebookApp.token=${JUPYTER_TOKEN:-brain}
      - --NotebookApp.password=

  docs:
    image: 3d-brain:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-3d-docs
    working_dir: /app
    volumes:
      - .:/app
    command: python -m sphinx -E -b html docs/source docs/build/html
